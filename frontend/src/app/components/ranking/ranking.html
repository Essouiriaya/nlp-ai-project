<div class="card shadow-sm mx-auto mt-5" style="max-width: 900px;">
  <div class="card-body">
    <h2 class="card-title text-center mb-4">Classement des CVs pour un Job</h2>

    <div class="mb-3">
      <label class="form-label">Sélectionnez un job :</label>
      <select [(ngModel)]="selectedJobId" class="form-select">
        <option value="" disabled selected>Choisissez un job</option>
        <option *ngFor="let job of jobs" [value]="job.id">{{ job.title }}</option>
      </select>
    </div>

    <button (click)="runMatching()" 
            [disabled]="!selectedJobId"
            class="btn btn-primary w-100 mb-3">
      Lancer Matching
    </button>

    <div *ngIf="loading" class="text-center text-muted mb-3">Chargement...</div>

    <div *ngIf="cvList.length > 0" class="table-responsive">
      <table class="table table-bordered table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Nom CV</th>
            <th>Score (%)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cv of cvList">
            <td>{{ cv.filename }}</td>
            <td>{{ cv.score | number:'1.0-2' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
