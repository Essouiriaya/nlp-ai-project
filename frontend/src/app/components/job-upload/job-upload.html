<div class="card shadow-sm mx-auto mt-5" style="max-width: 600px;">
  <div class="card-body">
    <h2 class="card-title text-center mb-4">Ajouter une offre d'emploi</h2>

    <div class="mb-3">
      <label class="form-label">Titre du poste :</label>
      <input type="text" [(ngModel)]="title" placeholder="Titre du poste" class="form-control"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Description du poste :</label>
      <textarea [(ngModel)]="description" rows="4" placeholder="Description du poste" class="form-control"></textarea>
    </div>

    <button (click)="addJob()" 
            [disabled]="!title || !description"
            class="btn btn-primary w-100">
      Enregistrer
    </button>

    <div *ngIf="message" class="alert alert-success text-center mt-3">
      {{ message }}
    </div>
  </div>
</div>
